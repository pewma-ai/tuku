# Verificación previa al commit (DEVEL.md).
# Hooks locales: reúsan el entorno del proyecto vía `uv run`, sin mirrors
# externos ni versiones de ruff/mypy separadas de pyproject.toml.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check .
        language: system
        pass_filenames: false
        types: [python]

      - id: mypy
        name: mypy (src, tests)
        entry: uv run mypy src tests
        language: system
        pass_filenames: false
        types: [python]

      - id: pytest-unittests
        name: pytest (solo tests unitarios en memoria)
        entry: uv run pytest --unittests
        language: system
        pass_filenames: false
        types: [python]

      - id: home-empaquetado
        name: regenera src/tuku/_home desde template/
        entry: uv run python -m tuku._pack
        language: system
        pass_filenames: false
        files: ^template/
