[build-system]
requires = ["setuptools>=68", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]

[project]
name = "tuku"
requires-python = ">=3.14"
dynamic = ["version"]
dependencies = [
    "pydantic>=2.0",
    "PyYAML>=6",
]

[project.scripts]
tuku = "tuku.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tuku = ["procesos/*.md", "templates/*", "migrations/*"]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.11",
  "PyYAML>=6",
  "types-PyYAML",
  "pre-commit>=3.8",
]

# ---------------------------------------------------------------------------
# pytest
#
# `--strict-markers` es deliberado: un marcador mal escrito (`@pytest.mark.agente`
# en vez de `agentic`) haría que el test se saltara en silencio. Con esto, falla.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
  "--strict-markers",
  "--strict-config",
  "-ra",
  # Por defecto NO se corren los tests que gastan tokens.
  "-m", "not agentic",
]
markers = [
  "spec: caso extraído de un bloque normativo de spec/ (nivel 1)",
  "invariante: viola una invariante a propósito y exige que el janitor la detecte (nivel 2)",
  "aceptacion: deriva de corpus/simulaciones/ (nivel 3)",
  "replay: reconstrucción con diff exactamente cero (nivel 4)",
  "agentic: invoca un modelo. Gasta tokens. Excluido salvo `-m agentic`",
  "lento: tarda más de un segundo",
]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["tuku"]

[tool.ruff]
line-length = 96
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# La prosa del proyecto es española y usa raya y comillas tipográficas a propósito.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.14"
files = ["src"]
strict = true

