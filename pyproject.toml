[build-system]
requires = ["setuptools>=68", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]

[project]
name = "tuku"
requires-python = ">=3.11"
dynamic = ["version"]

[project.scripts]
tuku = "tuku.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tuku = ["procesos/*.md", "templates/*", "migrations/*"]


